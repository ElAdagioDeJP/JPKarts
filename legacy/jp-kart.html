<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JP Kart — Gran Premio Pixel (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d9d3ff; --panel:#c4bbf7; --ink:#1b1740; --key:#fff7e0; --keyedge:#8f86c9; --accent:#e8455a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1b1740;--panel:#241f55;--ink:#fff7e0;--key:#2f2a6b;--keyedge:#0f0c2a;--accent:#ffe45e;}
}
:root[data-theme="dark"]{--bg:#1b1740;--panel:#241f55;--ink:#fff7e0;--key:#2f2a6b;--keyedge:#0f0c2a;--accent:#ffe45e;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Press Start 2P",ui-monospace,"Courier New",monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
#game{display:block;width:min(96vw, calc((100dvh - 96px) * 4 / 3));max-width:100%;aspect-ratio:4/3;
  image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:4px solid var(--keyedge);box-shadow:0 0 0 4px var(--panel);outline:none}
#game:focus-visible{box-shadow:0 0 0 4px var(--accent)}
.help{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;font-size:9px;line-height:1.6;max-width:96vw;padding:0 8px}
.help span{white-space:nowrap}
kbd{font-family:inherit;font-size:8px;display:inline-block;padding:4px 6px;margin-right:6px;background:var(--key);color:var(--ink);border:2px solid var(--keyedge);border-bottom-width:4px}
@media (max-width:640px){.help{font-size:7px} kbd{font-size:7px;padding:3px 4px}}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Juego JP Kart. Usa el teclado para jugar."></canvas>
<div class="help" aria-label="Controles">
  <span><kbd>↑</kbd>Acelerar</span>
  <span><kbd>↓</kbd>Frenar</span>
  <span><kbd>← →</kbd>Girar</span>
  <span><kbd>Shift</kbd>Derrapar</span>
  <span><kbd>Espacio</kbd>Usar objeto</span>
  <span><kbd>P</kbd>Pausa</span>
  <span><kbd>M</kbd>Sonido</span>
</div>
<script>
(()=>{
"use strict";
// ================= constantes =================
const W=320,H=240;                 // coordenadas de interfaz
const RW=640,RH=480,SC=2;          // resolución del mundo
const F=320,H0=200,CAM_H=15,CAM_BACK=34,TS=2048,HM=512,LAPS=3,ROAD=42,ZMAX=1000,FOGS=420;
const FONT='"Press Start 2P", ui-monospace, monospace',OUT='#1a1026';
const cv=document.getElementById('game');cv.width=RW;cv.height=RH;
const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.setTransform(SC,0,0,SC,0,0);
const frame=ctx.createImageData(RW,RH);const buf=new Uint32Array(frame.data.buffer);const zbuf=new Float32Array(RW*RH);

// ================= utilidades =================
const hexRGB=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const toU32=h=>{const[r,g,b]=hexRGB(h);return((255<<24)|(b<<16)|(g<<8)|r)>>>0};
const SHC=new Map();
const shade=(h,f)=>{const key=h+f;let v=SHC.get(key);if(v)return v;const[r,g,b]=hexRGB(h);const c=x=>Math.max(0,Math.min(255,Math.round(x*f)));v='#'+[c(r),c(g),c(b)].map(x=>x.toString(16).padStart(2,'0')).join('');SHC.set(key,v);return v};
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmtTime=t=>{if(t==null)return'--:--.--';const m=Math.floor(t/60),s=t-m*60;return m+':'+s.toFixed(2).padStart(5,'0')};
function fogMix(c,f,fr,fg,fb){const r=c&255,g=(c>>8)&255,b=(c>>16)&255;return(0xff000000|((b+(fb-b)*f)<<16)|((g+(fg-g)*f)<<8)|(r+(fr-r)*f))>>>0}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16);

// ================= pixel art procedural =================
function spr(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height);return{cv:c,w:c.width,h:c.height,px:new Uint32Array(d.data.buffer)}}
function PX(w,h){return{w,h,a:new Array(w*h).fill(0)}}
const P={
  set(p,x,y,c){if(!c)return;x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<p.w&&y<p.h)p.a[y*p.w+x]=c},
  get(p,x,y){return x>=0&&y>=0&&x<p.w&&y<p.h?p.a[y*p.w+x]:0},
  rect(p,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)P.set(p,x+i,y+j,typeof c==='function'?c(i,j,w,h):c)},
  ell(p,cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)P.set(p,x,y,typeof c==='function'?c(dx,dy,x,y):c)}},
  tri(p,ax,ay,bx,by,cx,cy,c){const x0=Math.floor(Math.min(ax,bx,cx)),x1=Math.ceil(Math.max(ax,bx,cx)),y0=Math.floor(Math.min(ay,by,cy)),y1=Math.ceil(Math.max(ay,by,cy));
    const s=(px,py,qx,qy,rx,ry)=>(px-rx)*(qy-ry)-(qx-rx)*(py-ry);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const px=x+.5,py=y+.5,d1=s(px,py,ax,ay,bx,by),d2=s(px,py,bx,by,cx,cy),d3=s(px,py,cx,cy,ax,ay);
      if(!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)))P.set(p,x,y,typeof c==='function'?c(x,y):c)}},
  line(p,x0,y0,x1,y1,c,t=1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;for(let i=0;i<=n;i++){const x=lerp(x0,x1,i/n),y=lerp(y0,y1,i/n);P.rect(p,Math.floor(x-t/2+.5),Math.floor(y-t/2+.5),t,t,c)}},
  outline(p,col=OUT){const o=p.a.slice();for(let y=0;y<p.h;y++)for(let x=0;x<p.w;x++){if(o[y*p.w+x])continue;
    if((x>0&&o[y*p.w+x-1])||(x<p.w-1&&o[y*p.w+x+1])||(y>0&&o[(y-1)*p.w+x])||(y<p.h-1&&o[(y+1)*p.w+x]))p.a[y*p.w+x]=col}},
  toSpr(p){const c=document.createElement('canvas');c.width=p.w;c.height=p.h;const g=c.getContext('2d');for(let i=0;i<p.a.length;i++)if(p.a[i]){g.fillStyle=p.a[i];g.fillRect(i%p.w,(i/p.w)|0,1,1)}return spr(c)},
};
function mk(w,h,draw,outline=true){const p=PX(w,h);draw(p);if(outline)P.outline(p);return P.toSpr(p)}
function sph(base){const hi=shade(base,1.32),lo=shade(base,0.78),dk=shade(base,0.6);return(dx,dy)=>{const l=-(dx*0.62+dy*0.78);return l>0.5?hi:l>-0.05?base:l>-0.5?lo:dk}}
function cyl(base){const hi=shade(base,1.28),lo=shade(base,0.78),dk=shade(base,0.6);return(i,j,w)=>{const u=i/(w-1||1);return u<0.25?hi:u<0.6?base:u<0.85?lo:dk}}
// fuente mini 3x5
const MINI={J:['001','001','001','101','010'],P:['110','101','110','100','100'],K:['101','101','110','101','101'],A:['010','101','111','101','101'],R:['110','101','110','101','101'],T:['111','010','010','010','010'],' ':['000','000','000','000','000'],
  O:['010','101','101','101','010'],E:['111','100','110','100','111'],N:['101','111','111','111','101'],I:['111','010','010','010','111'],S:['011','100','010','001','110'],C:['011','100','100','100','011'],L:['100','100','100','100','111'],U:['101','101','101','101','111'],B:['110','101','110','101','110'],'1':['010','110','010','010','111']};
function miniText(p,str,x,y,col,s=1){let cx=x;for(const ch of str){const g=MINI[ch]||MINI[' '];for(let j=0;j<5;j++)for(let i=0;i<3;i++)if(g[j][i]==='1')P.rect(p,cx+i*s,y+j*s,s,s,col);cx+=4*s}}
const miniW=(str,s=1)=>str.length*4*s-s;

// ================= personajes =================
const STAT_NAMES={vel:'Velocidad',ace:'Aceleración',sue:'Suerte',man:'Manejo',pes:'Peso',vue:'Vuelo'};
const STAT_SHORT={vel:'Veloc.',ace:'Acel.',sue:'Suerte',man:'Manejo',pes:'Peso',vue:'Vuelo'};
const CHARS=[
  {name:'Marco',      helmet:'#e8455a',kart:'#ffe45e',skin:'#f0c090',acc:'mohawk',    accCol:'#2a1a12',mouth:'#b8404f',voice:150,st:{vel:4,ace:6,sue:5,man:10,pes:3,vue:5}},
  {name:'Guaycaipuro',short:'Guayca',helmet:'#2e8a4a',kart:'#c86a2a',skin:'#9a6040',acc:'none',beard:true,accCol:'#2a1a12',mouth:'#e89090',voice:105,st:{vel:5,ace:5,sue:8,man:7,pes:6,vue:7}},
  {name:'Luis',       helmet:'#6a3fd6',kart:'#f4f1ff',skin:'#d8a070',acc:'headphones',accCol:'#ffe45e',mouth:'#9a3040',voice:125,st:{vel:7,ace:6,sue:4,man:5,pes:8.5,vue:5}},
  {name:'Jesús',      helmet:'#f4f1ff',kart:'#2ec4b6',skin:'#c89060',acc:'tuft',beard:true,accCol:'#3a2a1a',mouth:'#e89090',voice:135,st:{vel:4,ace:7,sue:2,man:9,pes:7,vue:6}},
  {name:'Miguel',     helmet:'#22222e',kart:'#ff3df0',skin:'#e0a878',acc:'antenna',   accCol:'#ff3df0',mouth:'#b8404f',voice:160,st:{vel:8,ace:9,sue:1,man:5,pes:7.5,vue:2}},
  {name:'JP',         helmet:'#2f6bff',kart:'#ff8a1f',skin:'#e0a878',acc:'glasses',   accCol:'#ffe45e',mouth:'#b8404f',voice:145,st:{vel:3,ace:10,sue:6,man:6,pes:8.5,vue:9}},
  {name:'Mario',      helmet:'#9aa0b4',kart:'#8fe03a',skin:'#e8b890',acc:'headphones',accCol:'#2ec4b6',mouth:'#b8404f',voice:115,st:{vel:5,ace:6,sue:5,man:9,pes:8,vue:7}},
  {name:'Andrés',     helmet:'#3df0ff',kart:'#6a3fd6',skin:'#f0c8a0',acc:'spikes',    accCol:'#ffe45e',mouth:'#b8404f',voice:170,st:{vel:6,ace:7,sue:6,man:8,pes:4,vue:7}},
];
function autoDesc(s){const e=Object.entries(s).filter(([k])=>k!=='pes');e.sort((a,b)=>b[1]-a[1]);
  return 'Fuerte en '+STAT_NAMES[e[0][0]].toLowerCase()+', flojo en '+STAT_NAMES[e[e.length-1][0]].toLowerCase()+'.'}
for(const c of CHARS){const s=c.st;c.spd=0.85+s.vel*0.03;c.acl=0.75+s.ace*0.05;c.hnd=0.8+s.man*0.04;c.luck=s.sue;c.w=s.pes;c.fly=s.vue;c.short=c.short||c.name;c.desc=autoDesc(s)}
const BEARD='#3a2418';
function drawAcc(p,c,cx,cy,r){
  const A=c.accCol,Ad=shade(A,0.75);
  switch(c.acc){
    case'antenna':P.line(p,cx,cy-r*0.9,cx+r*0.3,cy-r*1.6,'#2a2833',Math.max(1,Math.round(r/7)));P.ell(p,cx+r*0.3,cy-r*1.7,r*0.24,r*0.24,sph(A));break;
    case'spikes':for(const o of[-0.5,0,0.5])P.tri(p,cx+o*r-r*0.22,cy-r*0.75,cx+o*r+r*0.22,cy-r*0.75,cx+o*r,cy-r*1.38,(x)=>x<cx+o*r?shade(A,1.15):Ad);break;
    case'mohawk':for(let i=-2;i<=2;i++)P.tri(p,cx+i*r*0.15-r*0.12,cy-r*0.8,cx+i*r*0.15+r*0.12,cy-r*0.8,cx+i*r*0.15,cy-r*(1.35-Math.abs(i)*0.08),i%2?A:Ad);break;
    case'tuft':P.ell(p,cx+r*0.12,cy-r*1.05,r*0.22,r*0.3,A);P.ell(p,cx-r*0.14,cy-r*1.1,r*0.17,r*0.24,Ad);break;
    case'headphones':{const t=Math.max(1,Math.round(r/5));for(let i=0;i<=24;i++){const a=Math.PI+i/24*Math.PI;P.rect(p,Math.round(cx+Math.cos(a)*r*1.04-t/2),Math.round(cy+Math.sin(a)*r*1.1-t/2),t,t,'#2a2833')}break}
  }
}
function drawAccPost(p,c,cx,cy,r){if(c.acc==='headphones')for(const s of[-1,1])P.ell(p,cx+s*r*0.98,cy+r*0.12,r*0.3,r*0.44,sph(c.accCol))}
function suitOf(c){return shade(c.helmet,0.72)}
function kartBack(c,lean){
  const p=PX(32,34),oy=4,K=c.kart,S=suitOf(c),tire='#2a2833',tread='#15131c';
  for(const s of[0,1]){const x=s?24:1,dy=lean===0?0:((s===1)===(lean>0)?1:0);
    P.rect(p,x,oy+17+dy,7,12,(i,j)=>j%3===0?tread:i===1?'#4a4858':i===5?'#1f1d28':tire)}
  P.rect(p,6,oy+23,20,4,(i,j)=>j===0?'#7a7888':j===3?'#2a2838':'#3a3848');
  for(let y=oy+13;y<oy+24;y++){const j=y-oy-13,x0=j<3?9-j:7,x1=j<3?22+j:24;
    for(let x=x0;x<=x1;x++){let k=j<2?1.3:j<5?1.08:j<9?0.92:0.74;if(x<10||x>21)k*=0.86;P.set(p,x,y,shade(K,k))}}
  P.rect(p,8,oy+15,16,1,shade(K,1.45));
  P.rect(p,12,oy+17,8,5,(i,j)=>j%2?'#4a5060':i<2?'#c0c4d4':'#9aa0b4');
  for(const ex of[10,22]){P.ell(p,ex,oy+25.5,1.8,1.8,'#c0c4d4');P.set(p,ex,oy+25,'#2a2833')}
  const hx=16+lean*1.5;
  P.ell(p,16+lean,oy+13,6.6,4.2,sph(S));
  drawAcc(p,c,hx,oy+6.5,6.6);
  P.ell(p,hx,oy+6.5,6.7,6.7,sph(c.helmet));
  for(let y=oy;y<oy+13;y++){const x=Math.round(hx-0.5);if(P.get(p,x,y))P.set(p,x,y,y<oy+4?shade(c.accCol,1.2):c.accCol)}
  drawAccPost(p,c,hx,oy+6.5,6.6);
  P.outline(p);return P.toSpr(p);
}
function kartFront(c){
  const p=PX(32,34),oy=4,K=c.kart,S=suitOf(c),tire='#2a2833',tread='#15131c';
  for(const x of[2,24])P.rect(p,x,oy+21,6,9,(i,j)=>j%3===0?tread:i===1?'#4a4858':tire);
  for(let y=oy+19;y<oy+29;y++){const j=y-oy-19,x0=j<2?10:8,x1=j<2?21:23;for(let x=x0;x<=x1;x++){let k=j<2?1.28:j<6?1.0:0.8;if(x<10||x>21)k*=0.86;P.set(p,x,y,shade(K,k))}}
  P.rect(p,7,oy+27,18,2,(i,j)=>j?'#7a7888':'#c0c4d4');
  P.rect(p,10,oy+23,3,2,'#fff7b0');P.rect(p,19,oy+23,3,2,'#fff7b0');
  P.ell(p,16,oy+16,6.6,4,sph(S));
  P.rect(p,12,oy+18,8,2,'#2a2833');P.rect(p,11,oy+17,2,2,c.skin);P.rect(p,19,oy+17,2,2,c.skin);
  drawAcc(p,c,16,oy+8,7);
  P.ell(p,16,oy+8,7.1,7.1,sph(c.helmet));
  P.ell(p,16,oy+9.8,4.9,4.2,(dx,dy)=>dy>0.55?shade(c.skin,0.82):c.skin);
  if(c.beard)P.ell(p,16,oy+12.4,4.4,1.6,BEARD);
  if(c.acc==='glasses'){P.rect(p,12,oy+8,8,2,'#20306e');P.set(p,13,oy+8,'#6a9aff');P.set(p,17,oy+8,'#6a9aff')}
  else{P.rect(p,14,oy+8,1,2,OUT);P.rect(p,18,oy+8,1,2,OUT)}
  P.rect(p,15,oy+12,2,1,c.mouth);
  drawAccPost(p,c,16,oy+8,7);
  P.outline(p);return P.toSpr(p);
}
function portrait(c){
  const p=PX(32,32),S=suitOf(c);
  P.ell(p,16,33,13,8,sph(S));
  drawAcc(p,c,16,15,11);
  P.ell(p,16,15,11,11,sph(c.helmet));
  P.ell(p,16,17.5,7.6,6.6,(dx,dy)=>dy>0.62?shade(c.skin,0.8):(dx<-0.45&&dy<-0.1)?shade(c.skin,1.1):c.skin);
  if(c.beard)P.ell(p,16,21.8,7,3.2,(dx,dy)=>dy>-0.7?BEARD:0);
  for(const ex of[12,19]){P.rect(p,ex,15,2,3,OUT);P.set(p,ex,15,'#ffffff')}
  if(!c.beard){P.rect(p,10,19,2,1,'#ff8a9a');P.rect(p,21,19,2,1,'#ff8a9a')}
  P.set(p,14,20,c.mouth);P.set(p,18,20,c.mouth);P.rect(p,15,21,3,1,c.mouth);
  if(c.acc==='glasses'){P.rect(p,10,14,5,4,'#20306e');P.rect(p,17,14,5,4,'#20306e');P.rect(p,15,15,2,1,'#20306e');P.rect(p,11,14,2,1,'#6a9aff');P.rect(p,18,14,2,1,'#6a9aff')}
  P.ell(p,12,9,2.2,1.4,shade(c.helmet,1.55));
  drawAccPost(p,c,16,15,11);
  P.outline(p);return P.toSpr(p);
}
for(const c of CHARS){c.spr={B:kartBack(c,0),L:kartBack(c,-1),R:kartBack(c,1),F:kartFront(c)};c.face=portrait(c)}
// modelo de vóxeles para la animación de 360° del podio
function voxelKart(c){
  const V=new Map(),add=(x,y,z,col)=>V.set(x+','+y+','+z,[x,y,z,col]);
  const box=(x0,x1,y0,y1,z0,z1,col)=>{for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(let z=Math.min(z0,z1);z<=Math.max(z0,z1);z++)add(x,y,z,typeof col==='function'?col(x,y,z):col)};
  const tire='#2a2833',rim='#b8bccc',K=c.kart,S=suitOf(c),A=c.accCol;
  for(const s of[-1,1]){box(s*5,s*7,-8,-4,0,4,(x,y,z)=>(x===s*7&&y>=-7&&y<=-5&&z>=1&&z<=3)?rim:tire);box(s*5,s*7,4,7,0,3,(x,y,z)=>(x===s*7&&y>=5&&y<=6&&z>=1&&z<=2)?rim:tire)}
  box(-4,4,-8,8,1,1,'#3a3848');
  box(-5,5,-6,6,2,3,(x,y,z)=>z===3?shade(K,1.18):K);

  if(banner){banner.life-=dt;txt(banner.t,W/2,banner.big?H/2-24:66,'#ffe45e',banner.big?24:16,'center');if(banner.life<=0)banner=null}
  if(muted)txtS('Sin sonido',W/2,H-24);
}
function drawSmudge(){if(!player||player.smudge<=0)return;ctx.globalAlpha=Math.min(0.85,player.smudge);ctx.fillStyle='#1a1026';
  for(const[x,y,r]of[[70,90,26],[120,150,34],[210,110,30],[250,170,22],[160,70,18],[40,170,20]]){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function bg(a=.72){ctx.fillStyle='rgba(27,23,64,'+a+')';ctx.fillRect(0,0,W,H)}
function drawTitle(t){
  bg(.25);ctx.font='40px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';const y=40+Math.round(Math.sin(t*2)*2);
  for(let i=6;i>0;i--){ctx.fillStyle=i>3?OUT:'#e8455a';ctx.fillText('JP KART',W/2+i,y+i)}ctx.fillStyle='#ffe45e';ctx.fillText('JP KART',W/2,y);ctx.fillStyle='#fff7b0';ctx.fillText('JP KART',W/2,y-1);ctx.fillStyle='#ffe45e';ctx.fillText('JP KART',W/2,y+1);
  ctx.fillStyle='#ff8a1f';ctx.fillRect(W/2-128,y+46,256,2);txt('Gran Premio Pixel',W/2,y+56,'#fff7e0',8,'center');
  const b=Math.round(Math.abs(Math.sin(t*3))*14);ctx.drawImage(BIGBALL.cv,W/2+104,y-14-b,20,20);
  CHARS.forEach((c,i)=>{const x=W/2-140+i*35,bb=Math.round(Math.sin(t*5+i)*2);ctx.drawImage(c.face.cv,x,146+bb,32,32)});
  if(((t*2)|0)%2===0)txt('Pulsa Enter para jugar',W/2,202,'#fff7e0',8,'center');
}
function drawMenu(t){
  bg(.6);txt('JP KART',W/2,24,'#ffe45e',24,'center');
  const items=['Torneo','Carrera libre','Dificultad: '+DIFFS[diff].name];
  const help=['4 copas de 4 carreras. Se suman los puntos.','Elige cualquiera de las 16 pistas.','Qué tan rápidos y listos son los rivales.'];
  items.forEach((s,i)=>{const on=i===menuSel,y=76+i*34;panel(W/2-90,y,180,24,on?'#3a3478':'#241f55',on?'#ffe45e':'#6d66b0');
    if(on)ctx.drawImage(BALLS[((t*8)|0)%4].cv,W/2-84,y+4,16,16);
    txt(i===2?(on?'< ':'')+s+(on?' >':''):s,W/2,y+8,on?'#ffe45e':'#fff7e0',8,'center')});
  txtS(help[menuSel],W/2,188);txtS('Flechas para moverte, Enter para elegir',W/2,214,'#9c95d6');
}
function statBar10(key,v,x,y){txtS(STAT_SHORT[key],x,y,'#fff7e0','left');
  for(let i=0;i<10;i++){const f=clamp(v-i,0,1);ctx.fillStyle=OUT;ctx.fillRect(x+40+i*6,y-1,5,7);ctx.fillStyle='#3a3478';ctx.fillRect(x+41+i*6,y,3,5);
    if(f>0){ctx.fillStyle=i<4?'#2ec46b':i<7?'#ffe45e':'#ff8a1f';ctx.fillRect(x+41+i*6,y,Math.max(1,Math.round(3*f)),5)}}
  txtS(String(v),x+104,y,'#fff7e0','left')}
function drawSelect(t){
  bg();txt('Elige piloto',W/2,6,'#ffe45e',16,'center');
  CHARS.forEach((c,i)=>{const col=i%4,row=i>>2,x=18+col*74,y=28+row*56,on=i===sel;
    panel(x,y,62,48,on?'#3a3478':'#241f55',on?'#ffe45e':'#6d66b0');const b=on?Math.round(Math.sin(t*8)*1.5):0;
    ctx.drawImage(c.face.cv,x+15,y+2+b,32,32);txtS(c.short,x+31,y+37,on?'#ffe45e':'#fff7e0')});
  const c=CHARS[sel];panel(10,144,W-20,90,'#1b1740');
  ctx.drawImage(rotFrames(c)[((t*10)|0)%24].cv,W-58,142,42,42);
  txt(c.name,18,150,'#ffe45e');txtS(c.desc,18,162,'#fff7e0','left');
  ['vel','ace','man','sue','pes','vue'].forEach((k,i)=>statBar10(k,c.st[k],18+(i%2)*124,176+((i/2)|0)*13));
  txtS(mode==='cup'?'Torneo':'Carrera libre',W-38,196,'#9c95d6');txtS(DIFFS[diff].name,W-38,206,'#9c95d6');txtS('Enter',W-38,218,'#9c95d6');
}
function trophy(x,y,col){ctx.fillStyle=OUT;ctx.fillRect(x-11,y-1,22,16);ctx.fillStyle=col;ctx.fillRect(x-10,y,20,14);ctx.fillStyle='#fff7e0';ctx.fillRect(x-7,y+2,3,6);ctx.fillStyle=col;ctx.fillRect(x-3,y+14,6,5);ctx.fillRect(x-7,y+19,14,3)}
function drawCupSel(t){
  bg();txt('Elige copa',W/2,8,'#ffe45e',16,'center');
  CUPS.forEach((c,i)=>{const x=12+(i%2)*152,y=32+((i/2)|0)*92,on=i===cupSel;panel(x,y,144,84,on?'#3a3478':'#241f55',on?c.col:'#6d66b0');
    trophy(x+18,y+10+(on?Math.round(Math.sin(t*6)):0),c.col);txt(c.name.replace('Copa ',''),x+38,y+8,on?c.col:'#fff7e0');
    c.tracks.forEach((ti,j)=>txtS(TRACK_DEFS[ti].name+(TRACK_DEFS[ti].flight?' *':''),x+38,y+26+j*13,'#fff7e0','left'))});
  txtS('* pista con vuelo    Puntos: 15 12 10 8 6 4 2 1',W/2,220,'#9c95d6');
}
function drawTrackSel(t){
  bg();txt('Elige circuito',W/2,6,'#ffe45e',16,'center');
  CUPS.forEach((c,r)=>txtS(c.name.replace('Copa ',''),38,28+r*44+16,c.col));
  TRACKS.forEach((trk,i)=>{const r=i>>2,x=66+(i%4)*62,y=26+r*44,on=i===trackSel;
    panel(x,y,56,38,on?'#3a3478':'#241f55',on?'#ffe45e':CUPS[r].col);
    ctx.fillStyle=trk.th.ground[0];ctx.fillRect(x+14,y+5,28,28);ctx.drawImage(trk.mini,x+14,y+5,28,28);
    if(trk.def.flight)txtS('*',x+50,y+2,'#8fe0ff')});
  const d=TRACK_DEFS[trackSel];txt(d.name,W/2,204,'#ffe45e',8,'center');
  const tags=[d.flight?'Rampas de vuelo':null,d.th.ice?'Hielo':null,d.liquid?d.liquid.msg.replace(/[¡!]/g,'').replace('Al ','Cuidado: ').replace('A la ','Cuidado: '):null,d.ramps.length?'Saltos':null].filter(Boolean);
  txtS(tags.join('  /  ')||'Clásica',W/2,216,'#fff7e0');txtS('Enter para correr, Esc para volver',W/2,228,'#9c95d6');
}
function rowList(list,extra){list.forEach((k,i)=>{const c=k.ch||k,y=44+i*19,me=c===CHARS[sel];panel(28,y,W-56,15,me?'#3a3478':'#241f55',me?'#ffe45e':'#6d66b0');
  txt((i+1)+'º',34,y+4,me?'#ffe45e':'#fff7e0');ctx.drawImage(c.face.cv,60,y-1,16,16);txt(c.name,80,y+4,me?'#ffe45e':'#fff7e0');extra(k,i,y)})}
function drawResults(){
  bg(.8);txt(TRACK_DEFS[trackSel].name,W/2,8,'#ffe45e',8,'center');txt('Resultados',W/2,20,'#fff7e0',16,'center');
  rowList(finalOrder,(k,i,y)=>{txt(k.finished?fmtTime(k.time):'En pista',W-(mode==='cup'?70:36),y+4,'#fff7e0',8,'right');if(mode==='cup')txt('+'+POINTS[i],W-36,y+4,'#2ec46b',8,'right')});
  if(player.best!=null)txtS('Tu mejor vuelta: '+fmtTime(player.best),W/2,200);
  txtS(mode==='cup'?'Enter: ver clasificación':'Enter: ver podio    Esc: menú',W/2,220,'#9c95d6');
}
function standingsList(){return CHARS.slice().sort((a,b)=>cup.pts[b.name]-cup.pts[a.name])}
function drawStandings(){
  bg(.85);txt(cup.def.name,W/2,8,cup.def.col,8,'center');txt('Clasificación',W/2,20,'#fff7e0',16,'center');
  rowList(standingsList(),(c,i,y)=>{txt('+'+(cup.gain[c.name]||0),W-90,y+4,'#2ec46b',8,'right');txt(String(cup.pts[c.name]),W-36,y+4,'#ffe45e',8,'right')});
  const last=cup.race>=cup.def.tracks.length-1;txtS('Carrera '+(cup.race+1)+' de '+cup.def.tracks.length,W/2,202);
  txtS(last?'Enter: ver podio':'Enter: siguiente carrera, '+TRACK_DEFS[cup.def.tracks[cup.race+1]].name,W/2,218,'#9c95d6');
}
// podio con los 3 karts girando 360°
function drawPodium(list,title,col,sub,t){
  bg(.8);txt(title,W/2,8,col,16,'center');
  const ped=[[1,W/2-86,26],[0,W/2,42],[2,W/2+86,14]],base=164;
  for(const[i,x,h]of ped){const c=list[i];if(!c)continue;
    ctx.fillStyle=OUT;ctx.fillRect(x-32,base-h-1,64,h+1);ctx.fillStyle=i===0?'#ffe45e':i===1?'#c8ccdc':'#d9894a';ctx.fillRect(x-31,base-h,62,h);
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(x-31,base-h,62,3);txt(String(i+1),x,base-h+6,OUT,8,'center','#fff7e0');
    const fr=rotFrames(c)[((t*12+i*8)|0)%24];ctx.drawImage(fr.cv,x-21,base-h-38,42,42);
    ctx.drawImage(c.face.cv,x-8,base-h-56+Math.round(Math.sin(t*5+i)*2),16,16);
    txtS(c.short,x,base+5,'#fff7e0');if(sub)txtS(sub(c),x,base+14,'#ffe45e')}
  for(let i=0;i<18;i++){const x=(i*53+t*40)%W,y=(i*37+t*60)%150;ctx.fillStyle=['#ffe45e','#e8455a','#2ec46b','#3df0ff'][i%4];ctx.fillRect(x,y,2,3)}
}
function drawPodiumFree(t){
  const L=finalOrder.map(k=>k.ch);drawPodium(L,'Podio',TRACK_DEFS[trackSel].th.curbB||'#ffe45e',c=>{const k=finalOrder.find(q=>q.ch===c);return k.finished?fmtTime(k.time):''},t);
  const pos=finalOrder.findIndex(k=>k.isPlayer)+1;
  txt(pos===1?'¡Ganaste!':pos<=3?'¡Al podio!':'Quedaste '+pos+'º',W/2,196,'#ff8a1f',8,'center');txtS('Enter: otra carrera    Esc: menú',W/2,216,'#9c95d6');
}
function drawFinal(t){
  const st=standingsList();drawPodium(st,cup.def.name,cup.def.col,c=>cup.pts[c.name]+' pts',t);
  const pos=st.indexOf(CHARS[sel])+1;
  txt(pos===1?'¡'+CHARS[sel].name+' gana la copa!':pos<=3?'¡Al podio, '+CHARS[sel].name+'!':'Quedaste '+pos+'º. ¡A por la revancha!',W/2,192,'#ff8a1f',8,'center');
  txtS('Dificultad: '+DIFFS[diff].name,W/2,206);txtS('Enter para volver al menú',W/2,220,'#9c95d6');
}

// ================= bucle =================
let last=performance.now();
function frameWorld(t){renderWorld();drawWorldSprites(t);ctx.putImageData(frame,0,0);for(const[s,x,y,c]of labels)txtS(s,x,y,c)}
const MENUS=['title','menu','select','cup','track'];
function loop(now){
  const dt=clamp((now-last)/1000,0,1/30);last=now;const t=now/1000;
  if(state==='loading'){ctx.fillStyle='#1b1740';ctx.fillRect(0,0,W,H);txt('Cargando pista...',W/2,H/2-14,'#ffe45e',8,'center');txtS(TRACK_DEFS[pendingRace].name,W/2,H/2+4);
    ctx.drawImage(BALLS[((t*8)|0)%4].cv,W/2-8,H/2+18,16,16);
    if(++loadF>=3){ensureBuilt(TRACKS[pendingRace]);startRace(pendingRace)}}
  else if(MENUS.includes(state)){
    const want=state==='track'?TRACKS[trackSel]:state==='cup'?TRACKS[CUPS[cupSel].tracks[0]]:TRACKS[((t/10)|0)%TRACKS.length];
    if(want.built&&want!==tr){tr=want;const i=Math.floor(attract.s)%tr.N;cam.a=tr.ang[i];camZ=tr.hc[i]+CAM_H}
    attract.s=((attract.s+dt*30)%tr.N+tr.N)%tr.N;const i=Math.floor(attract.s)%tr.N,x=tr.x[i],y=tr.y[i];
    updateCam(dt,x,y,tr.ang[i],hAt(x,y));racers=[];frameWorld(t);
    ({title:drawTitle,menu:drawMenu,select:drawSelect,cup:drawCupSel,track:drawTrackSel})[state](t);engineSet(false,0);
  }else if(state==='countdown'||state==='race'){
    if(!paused){
      if(state==='countdown'){cd-=dt;if(K('ArrowUp','KeyW'))player.held+=dt;else player.held=0;
        const n=Math.ceil(cd);if(n<cdLast&&n>0){cdLast=n;beep(440,.12)}
        if(cd<=0){state='race';banner={t:'¡Ya!',life:.9,big:true};beep(880,.3);if(player.held>0&&player.held<1.1){player.boost=0.9;player.speed=90}}}
      else updateRace(dt)}
    updateCam(paused?0:dt,player.x,player.y,player.spin>0?cam.a:player.a,player.z);
    frameWorld(raceT);
    if(!paused)spawnPlayerParticles();drawParticles(paused?0:dt);drawSmudge();
    if(flashT>0){ctx.globalAlpha=Math.min(0.6,flashT*2);ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
    if(state==='countdown'){const n=Math.ceil(cd);txt(n>0?String(n):'',W/2,H/2-40,'#ffe45e',40,'center');
      txt(TRACK_DEFS[trackSel].name,W/2,34,'#fff7e0',8,'center');txtS('Truco: acelera justo en el 1 para salir con turbo',W/2,H-30);}
    else drawHUD(paused?0:dt);
    engineSet(!paused,player.speed+(player.boost>0?40:0));
    if(paused){bg(.7);txt('Pausa',W/2,80,'#ffe45e',24,'center');txt('P para seguir',W/2,130,'#fff7e0',8,'center');txt('Esc para salir al menú',W/2,146,'#fff7e0',8,'center')}
  }else{
    updateRace(dt);updateCam(dt,player.x,player.y,player.a,player.z);frameWorld(raceT);
    ({results:drawResults,standings:drawStandings,final:drawFinal,podium:drawPodiumFree})[state](t);engineSet(false,0);
  }
  // música según la pista
  if(MENUS.includes(state))musicWant('menu');
  else if(state==='loading'||state==='countdown')musicWant(null);
  else if(state==='race'&&player.finished)musicWant(null);
  else if(state==='race'){const d=TRACK_DEFS[trackSel],lastLap=player.prog>=(LAPS-1)*tr.N;musicWant(d.song,d.mul*(lastLap?1.1:1),paused?0:1)}
  else musicWant('menu',1,0.7);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
